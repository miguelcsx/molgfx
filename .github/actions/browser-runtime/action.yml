# Builds the one MolGFX browser runtime (crates/molgfx-wasm/js/dist) and
# copies it wherever a consumer reads it. Every workflow that needs the
# runtime comes through here, so the build is defined once.
name: Browser runtime
description: Build the molgfx-wasm bindings and viewer host into dist/, then copy it out.

inputs:
  out:
    description: Space-separated directories that receive a copy of dist/.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: crates/molgfx-wasm/js/package-lock.json
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        key: browser-runtime
    - uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack
    - shell: bash
      working-directory: crates/molgfx-wasm/js
      run: npm ci
    - shell: bash
      env:
        OUT: ${{ inputs.out }}
      run: |
        set -euo pipefail
        args=()
        for dir in $OUT; do args+=(--out "$dir"); done
        node crates/molgfx-wasm/js/scripts/build.mjs "${args[@]}"
