name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: RUSTDOCFLAGS='-Dwarnings' cargo test --workspace --all-features --doc
      - run: cargo test -p molgfx-shaders --all-features
      - run: cargo bench --workspace --no-run
      - name: Repository policy
        shell: bash
        run: |
          set -euo pipefail
          if grep -rnE '#\[(allow|expect)\b' crates --include='*.rs'; then exit 1; fi
          if grep -rnE 'level[[:space:]]*=[[:space:]]*"allow"|allow[[:space:]]*=' . --include='*.toml'; then exit 1; fi
          if grep -rn 'unwrap' crates --include='*.rs' \
            | grep -v '_tests.rs' \
            | grep -v '/tests.rs' \
            | grep -v 'generic_tests/'; then exit 1; fi
          find crates \( -name '*.rs' -o -name '*.wgsl' \) -print0 \
            | xargs -0 wc -l \
            | awk '$1 > 500 && $2 != "total" { print; failed = 1 } END { exit failed }'
          if grep -rnE '(^|[^A-Za-z_])unsafe([[:space:]]*\{|[[:space:]]+(fn|impl|trait|extern|static|mut))' \
            crates --include='*.rs' \
            | grep -v bytemuck; then exit 1; fi
          # A corpus directory is named in exactly one place: the bench
          # harness's resolver. Any other hit is a call site building a path.
          if grep -rn 'benchmarks/' crates --include='*.rs' \
            | grep -v 'crates/molgfx-bench/src/fixtures.rs'; then exit 1; fi

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check -p molgfx-wasm --target wasm32-unknown-unknown --all-features
      - run: cargo clippy -p molgfx-wasm --target wasm32-unknown-unknown --all-targets --all-features -- -D warnings

  # The browser runtime is built once per run; the jobs that need it download
  # this artifact instead of building their own.
  browser-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: browser-runtime
          path: crates/molgfx-wasm/js/dist
          if-no-files-found: error

  python:
    needs: browser-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Virtual environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install --upgrade pip maturin mypy anywidget numpy
      - run: python -m pip install 'molframe>=0.4.0'
      - uses: actions/download-artifact@v4
        with:
          name: browser-runtime
          path: python/molgfx/viewer/static
      - run: maturin develop -m crates/molgfx-py/Cargo.toml
      - run: python -m unittest discover -s python/tests
      # Tests run against the source tree; this proves the wheel carries the
      # same browser runtime, which is how a notebook actually receives it.
      - name: Wheel carries the browser runtime
        run: |
          set -euo pipefail
          maturin build -m crates/molgfx-py/Cargo.toml --out wheel
          listing=$(python -m zipfile -l wheel/*.whl)
          for name in widget.js widget.css runtime-manifest.json molgfx_wasm.js molgfx_wasm_bg.wasm; do
            printf '%s\n' "$listing" | grep -q "molgfx/viewer/static/$name" \
              || { echo "::error::the wheel does not carry viewer/static/$name"; exit 1; }
          done
      - run: python -m mypy.stubtest molgfx._engine

  # Builds the extension in release form and renders a PNG on a host with no
  # GPU, through Mesa's software Vulkan/GL: `import molgfx` alone would not
  # notice a build without a usable graphics backend.
  headless-render:
    name: headless-render (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            backend: ""
          - name: vulkan
            backend: vulkan
          - name: gl
            backend: gl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri libegl1
      - run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install --upgrade pip maturin anywidget numpy 'molframe>=0.4.0'
      - run: maturin develop --release -m crates/molgfx-py/Cargo.toml
      - run: |
          if [ "${{ matrix.name }}" = default ]; then
            env -u WGPU_BACKEND python python/tests/headless_render.py
          else
            WGPU_BACKEND="${{ matrix.backend }}" python python/tests/headless_render.py
          fi
      - run: |
          if [ "${{ matrix.name }}" = default ]; then
            env -u WGPU_BACKEND python python/tests/headless_determinism.py
          else
            WGPU_BACKEND="${{ matrix.backend }}" python python/tests/headless_determinism.py
          fi

  browser:
    needs: browser-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Virtual environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install --upgrade pip maturin anywidget numpy playwright
      - run: python -m pip install 'molframe>=0.4.0'
      - run: maturin develop -m crates/molgfx-py/Cargo.toml
      - run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: browser-runtime
          path: python/molgfx/viewer/static
      - run: python -m unittest discover -s python/tests -p 'test_*viewer.py' -v
        env:
          DEBUG: pw:browser
