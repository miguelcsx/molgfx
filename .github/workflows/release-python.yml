# Publish the Python distribution to PyPI when a push to main bumps the version.
#
# Separate from `release.yml` on purpose: PyPI is a different registry with a
# different trusted publisher and a different failure domain, so the two are
# run independently and either can be re-run alone.
#
# Authentication is OIDC via PyPI's trusted publisher (owner `miguelcsx`,
# repository `molgfx`, workflow `release-python.yml`, environment `release`),
# so no token is stored here.
#
name: Release Python

on:
  # Every push to main runs; `detect` below stops it unless the manifest names
  # a version that has not been released. Bumping the version is the release.
  push:
    branches: [main]
  # Kept for re-running a release by hand. The version is optional and, when
  # given, must equal the manifest's.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (defaults to the manifest's)"
        required: false
        type: string
      dry-run:
        description: "Build and check wheels and source distribution, then stop before uploading"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-python
  cancel-in-progress: false

jobs:
  # A version already on PyPI stops here, so only a push that bumps the
  # version publishes, and a failed upload is retried by the next push or a
  # manual run. pyproject.toml must name the same version as Cargo.toml.
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          case "$version" in
            *[!0-9A-Za-z.+-]*)
              echo "::error::version $version is not a valid semver"
              exit 1
              ;;
          esac
          if [ -n "${INPUT_VERSION:-}" ] && [ "$INPUT_VERSION" != "$version" ]; then
            echo "::error::input version $INPUT_VERSION does not match the workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          project=$(python3 -c 'import tomllib; p=tomllib.load(open("pyproject.toml","rb"))["project"]; print(p["name"], p["version"])')
          name=${project% *}
          declared=${project#* }
          if [ "$declared" != "$version" ]; then
            echo "::error::pyproject.toml declares $declared but Cargo.toml declares $version"
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$name/$version/json")
          if [ "$status" = "200" ]; then
            echo "::notice::$name $version is already on PyPI"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::PyPI answered $status for $name $version"
            exit 1
          fi

  verify:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser-runtime
      - run: npm test --prefix web
      - run: npm pack ./web --pack-destination web
      - uses: actions/upload-artifact@v4
        with:
          name: browser-runtime
          path: |
            web/dist
            web/*.tgz

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python tests
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip 'maturin>=1.15,<2' mypy numpy 'molframe>=0.4.0'
          python build_backend.py
          python .github/scripts/test-python-packaging.py
          maturin develop -m crates/molgfx-py/Cargo.toml
          python -m unittest discover -s python/tests
          python -m mypy.stubtest molgfx._engine

  sdist:
    needs: [detect, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: browser-runtime
          path: web
      - name: Reuse the canonical browser assets
        run: cp -R web/dist python/molgfx/static
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and rebuild the source distribution
        run: |
          set -euo pipefail
          python -m pip install build 'maturin>=1.15,<2'
          python -m build --sdist --outdir dist
          python .github/scripts/check-python-distributions.py dist/*.tar.gz --rebuild target/sdist-wheels
          python web/scripts/check-distributions.py web/molgfx-*.tgz "target/sdist-wheels/*.whl"
          python -m venv .venv
          .venv/bin/python -m pip install target/sdist-wheels/*.whl
          .venv/bin/python -m unittest discover -s python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz

  wheels:
    needs: [detect, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: linux-x86_64
          - runner: ubuntu-24.04-arm
            label: linux-aarch64
          - runner: macos-15-intel
            label: macos-x86_64
          - runner: macos-14
            label: macos-aarch64
          - runner: windows-latest
            label: windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: browser-runtime
          path: web
      - name: Reuse the canonical browser assets
        shell: bash
        run: cp -R web/dist python/molgfx/static

      # The wheels are abi3-py312, so the interpreter that installs them must
      # be at least 3.12; a runner's default python is not guaranteed to be.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify the prebuilt runtime
        shell: bash
        run: |
          python -m pip install 'maturin>=1.15,<2'
          python build_backend.py

      # Linux wheels are built inside the manylinux_2_28 container, so they
      # need glibc 2.28 rather than whatever the runner's newer glibc lets the
      # linker reach for. A wheel built on the bare runner carried the tag of
      # that runner's symbols -- manylinux_2_35, exactly Google Colab's glibc,
      # one symbol away from not installing there at all. The input is ignored
      # on macOS and Windows.
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          manylinux: "2_28"
          maturin-version: "v1.15.0"
          args: --release --auditwheel repair --out dist
      - name: Identical npm and wheel assets
        shell: bash
        run: python web/scripts/check-distributions.py web/molgfx-*.tgz "dist/*.whl"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.label }}
          path: dist

      # Exercise the actual installed extension and notebook assets, not the source tree.
      - name: Test the installed wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          if [ -d .venv/Scripts ]; then py=.venv/Scripts/python; else py=.venv/bin/python; fi
          "$py" -m pip install dist/*.whl
          "$py" -m unittest discover -s python/tests

      - name: Render with the embedded Windows compiler
        if: runner.os == 'Windows'
        shell: bash
        env:
          WGPU_BACKEND: dx12
          WGPU_DX12_COMPILER: staticdxc
        run: |
          set -euo pipefail
          .venv/Scripts/python python/tests/headless_render.py
          .venv/Scripts/python python/tests/headless_determinism.py

  # Importing is not rendering: this installs the built wheel on a bare Linux
  # host with no GPU and renders a PNG, so a wheel that cannot open a graphics
  # device is caught here. Mesa supplies software Vulkan (lavapipe) and GL.
  headless-render:
    needs: wheels
    name: headless-render (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            backend: ""
          - name: vulkan
            backend: vulkan
          - name: gl
            backend: gl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Software graphics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri libegl1

      - name: Render from the wheel
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install dist/*.whl 'molframe>=0.4.0'
          if [ "${{ matrix.name }}" = default ]; then
            env -u WGPU_BACKEND .venv/bin/python python/tests/headless_render.py
          else
            WGPU_BACKEND="${{ matrix.backend }}" .venv/bin/python python/tests/headless_render.py
          fi

  publish:
    needs: [wheels, sdist, headless-render]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    # Part of the identity PyPI's trusted publisher checks: without it the
    # OIDC token names no environment and PyPI finds no matching publisher.
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: python-sdist
          path: dist

      - name: List the distribution
        run: ls -la dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
