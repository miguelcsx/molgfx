# Publish the Python distribution to PyPI when a push to main bumps the version.
#
# Separate from `release.yml` on purpose: PyPI is a different registry with a
# different trusted publisher and a different failure domain, so the two are
# run independently and either can be re-run alone.
#
# Authentication is OIDC via PyPI's trusted publisher (owner `miguelcsx`,
# repository `molgfx`, workflow `release-python.yml`, environment `release`),
# so no token is stored here.
#
# The Jupyter widget loads a wasm-bindgen bundle that is built, not committed.
# It is built once, here, and dropped into every wheel, so a wheel never ships
# a loader with nothing to load.

name: Release Python

on:
  # Every push to main runs; `detect` below stops it unless the manifest names
  # a version that has not been released. Bumping the version is the release.
  push:
    branches: [main]
  # Kept for re-running a release by hand. The version is optional and, when
  # given, must equal the manifest's.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (defaults to the manifest's)"
        required: false
        type: string
      dry-run:
        description: "Build and check every wheel, then stop before uploading"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-python
  cancel-in-progress: false

jobs:
  # A version already on PyPI stops here, so only a push that bumps the
  # version publishes, and a failed upload is retried by the next push or a
  # manual run. pyproject.toml must name the same version as Cargo.toml.
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          case "$version" in
            *[!0-9A-Za-z.+-]*)
              echo "::error::version $version is not a valid semver"
              exit 1
              ;;
          esac
          if [ -n "${INPUT_VERSION:-}" ] && [ "$INPUT_VERSION" != "$version" ]; then
            echo "::error::input version $INPUT_VERSION does not match the workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          project=$(python3 -c 'import tomllib; p=tomllib.load(open("pyproject.toml","rb"))["project"]; print(p["name"], p["version"])')
          name=${project% *}
          declared=${project#* }
          if [ "$declared" != "$version" ]; then
            echo "::error::pyproject.toml declares $declared but Cargo.toml declares $version"
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$name/$version/json")
          if [ "$status" = "200" ]; then
            echo "::notice::$name $version is already on PyPI"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::PyPI answered $status for $name $version"
            exit 1
          fi

  verify:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python tests
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip maturin mypy anywidget numpy 'molframe>=0.1.2'
          maturin develop -m crates/molgfx-py/Cargo.toml
          python -m unittest discover -s python/tests
          python -m mypy.stubtest molgfx._engine

  wasm:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup target add wasm32-unknown-unknown

      - name: Build the browser runtime
        run: |
          set -euo pipefail
          cargo install wasm-pack --locked
          wasm-pack build crates/molgfx-wasm --release --target web \
            --out-dir ../../python/molgfx/viewer/static --out-name molgfx_wasm

      - uses: actions/upload-artifact@v4
        with:
          name: browser-runtime
          path: |
            python/molgfx/viewer/static/molgfx_wasm.js
            python/molgfx/viewer/static/molgfx_wasm_bg.wasm

  wheels:
    needs: [detect, wasm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: linux-x86_64
          - runner: ubuntu-24.04-arm
            label: linux-aarch64
          - runner: macos-15-intel
            label: macos-x86_64
          - runner: macos-14
            label: macos-aarch64
          - runner: windows-latest
            label: windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: browser-runtime
          path: python/molgfx/viewer/static

      # The wheels are abi3-py313, so the interpreter that installs them must
      # be at least 3.13; a runner's default python is not guaranteed to be.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.label }}
          path: dist

      # A wheel that installs but cannot import, or that lost the browser
      # runtime, is the failure this catches.
      - name: Install and import
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          if [ -d .venv/Scripts ]; then py=.venv/Scripts/python; else py=.venv/bin/python; fi
          "$py" -m pip install dist/*.whl
          "$py" -c 'import molgfx; print("molgfx imports")'
          listing=$("$py" -m zipfile -l dist/*.whl)
          if ! printf '%s\n' "$listing" | grep 'viewer/static/molgfx_wasm_bg.wasm' >/dev/null; then
            echo "::error::the wheel does not carry the browser runtime"
            exit 1
          fi

  # Importing is not rendering: this installs the built wheel on a bare Linux
  # host with no GPU and renders a PNG, so a wheel that cannot open a graphics
  # device is caught here. Mesa supplies software Vulkan (lavapipe) and GL.
  headless-render:
    needs: wheels
    name: headless-render (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            backend: ""
          - name: vulkan
            backend: vulkan
          - name: gl
            backend: gl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Software graphics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri libegl1

      - name: Render from the wheel
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install dist/*.whl 'molframe>=0.1.2'
          if [ "${{ matrix.name }}" = default ]; then
            env -u WGPU_BACKEND .venv/bin/python python/tests/headless_render.py
          else
            WGPU_BACKEND="${{ matrix.backend }}" .venv/bin/python python/tests/headless_render.py
          fi

  publish:
    needs: [wheels, headless-render]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: List the distribution
        run: ls -la dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
