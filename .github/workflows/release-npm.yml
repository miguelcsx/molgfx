name: Release npm

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Expected workspace version (optional; must match)"
        required: false
        type: string
      dry-run:
        description: "Build and verify the package without publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      package-exists: ${{ steps.version.outputs.package-exists }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { assertVersion } from './web/scripts/version.mjs';
          const version = assertVersion();
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?$/.test(version))
            throw new Error('Invalid release version: ' + version);
          if (process.env.INPUT_VERSION && process.env.INPUT_VERSION !== version)
            throw new Error('Requested version differs from workspace version');
          const response = await fetch('https://registry.npmjs.org/molgfx', {
            signal: AbortSignal.timeout(30000),
          });
          if (response.status !== 200 && response.status !== 404)
            throw new Error('npm registry answered ' + response.status);
          const exists = response.status === 200;
          const metadata = exists ? await response.json() : undefined;
          if (exists && (metadata.name !== 'molgfx' || !metadata.versions))
            throw new Error('Invalid npm registry metadata');
          const release = !exists || !Object.hasOwn(metadata.versions, version);
          appendFileSync(process.env.GITHUB_OUTPUT,
            `version=${version}\nrelease=${release}\npackage-exists=${exists}\ntag=${version.includes('-') ? 'next' : 'latest'}\n`);
          console.log(release ? 'Unpublished version: ' + version : 'Already published: ' + version);
          if (!exists) console.log('First publication and trusted publisher setup require a maintainer; OIDC release will fail closed until then.');
          JS

  verify:
    needs: detect
    if: needs.detect.outputs.release == 'true' || inputs.dry-run == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser-runtime
      - run: npm test --prefix web
      - name: Install real browser
        run: npx --prefix web playwright install --with-deps chromium
      - name: Verify packed public exports, SSR and emitted WebGPU wasm
        run: xvfb-run -a npm run test:bundler --prefix web
      - name: Pack the verified canonical assets
        run: |
          mkdir npm-release
          npm pack ./web --pack-destination npm-release
      - name: Explicit publication dry run
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: npm publish "./npm-release/molgfx-$VERSION.tgz" --dry-run --ignore-scripts --access public --tag "$TAG" --registry https://registry.npmjs.org/
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: npm-release/*.tgz
          if-no-files-found: error

  publish:
    needs: [detect, verify]
    if: >-
      needs.detect.outputs.release == 'true' &&
      !(github.event_name == 'workflow_dispatch' && inputs.dry-run) &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require registry bootstrap
        env:
          PACKAGE_EXISTS: ${{ needs.detect.outputs.package-exists }}
        run: |
          if [ "$PACKAGE_EXISTS" != true ]; then
            echo '::error::A maintainer must first publish molgfx and configure its trusted publisher: miguelcsx/molgfx, release-npm.yml, environment npm. No token fallback is provided.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-release
      - name: Publish the verified tarball using trusted OIDC
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/molgfx/$VERSION")
          if [ "$status" = 200 ]; then
            echo "::notice::molgfx $VERSION already exists; never overwrite it"
          elif [ "$status" = 404 ]; then
            npm publish "./npm-release/molgfx-$VERSION.tgz" --ignore-scripts --provenance --access public --tag "$TAG" --registry https://registry.npmjs.org/
          else
            echo "::error::npm registry answered $status"
            exit 1
          fi
