[package]
name = "molgfx-bench"
description = "Benchmark harness: kernel benches, the frame-loop harness and golden-scene gates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autobins = false
# A benchmark harness is not a published artifact. It also depends on the
# facade by path only, which Cargo refuses to package, so publishing cannot
# succeed for it even by accident.
publish = false

[dependencies]
thiserror.workspace = true
molgfx = { path = "../molgfx" }
molframe = { workspace = true, features = ["mmcif", "bcif", "pdb", "chemistry", "spatial"] }
png.workspace = true
num-traits.workspace = true
serde.workspace = true
serde_json.workspace = true
stats_alloc = "0.1.10"

[dev-dependencies]
criterion.workspace = true
# The packing benchmark measures a geometry-crate kernel directly. These are
# dev-dependencies: the harness itself still reaches the engine through the
# facade alone, and nothing in the workspace depends on this crate.
molgfx-core = { path = "../molgfx-core" }
molgfx-api = { path = "../molgfx-api" }
molgfx-geometry = { path = "../molgfx-geometry" }

[[bench]]
name = "kernels"
harness = false

[[bench]]
name = "semantic"
harness = false

[[bench]]
name = "scaling"
harness = false

[[bin]]
name = "focus_profile"
path = "src/bin/focus_profile.rs"

[[bin]]
name = "resources"
path = "src/bin/resources.rs"

[lints]
workspace = true
