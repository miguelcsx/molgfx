[package]
name = "molgfx-py"
description = "Thin, typed Python bindings for the molgfx facade."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
molframe-py.workspace = true
molgfx.workspace = true
pyo3 = { workspace = true, features = ["multiple-pymethods"] }
serde_json.workspace = true

# Cargo forbids `lints.workspace = true` next to a local override, so this crate
# restates the workspace set and adds its own. Keep both lists in step.
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
