[package]
name = "molgfx-core"
description = "The semantic scene graph: columnar tables, GPU record layouts, the borrowed coordinate seam."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
molgfx-math.workspace = true
molframe = { workspace = true, features = ["query", "surface"] }
bytemuck.workspace = true
smallvec.workspace = true
hashbrown.workspace = true
num-traits.workspace = true
thiserror.workspace = true
roaring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# Parallelism flows through `molgfx-math`'s threshold-guarded block helpers;
# rayon stays available to this crate's tests directly.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rayon.workspace = true
proptest.workspace = true
molframe = { workspace = true, features = ["mmcif"] }

[lints]
workspace = true
