[package]
name = "pdviewx"
description = "Facade crate: feature-gated re-exports of the public engine surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["realtime"]
# The interactive raster path over the default backend.
realtime = ["dep:pdviewx-render", "dep:pdviewx-gpu-wgpu"]
# The semantic layer: focus, banding, interactions.
semantic = ["realtime", "dep:pdviewx-semantic"]

[dependencies]
pdviewx-math.workspace = true
pdviewx-core.workspace = true
pdviewx-gpu.workspace = true
pdviewx-render = { workspace = true, optional = true }
pdviewx-gpu-wgpu = { workspace = true, optional = true }
pdviewx-semantic = { workspace = true, optional = true }

[dev-dependencies]
winit.workspace = true
pdbiox = { workspace = true, features = ["mmcif", "bcif", "pdb", "chem", "spatial"] }
png.workspace = true

[lints]
workspace = true

[[example]]
name = "pocket"
required-features = ["realtime"]

[[example]]
name = "ligand_cutaway"
required-features = ["semantic"]

[[example]]
name = "focus_cutaway"
required-features = ["semantic"]

[[example]]
name = "mem_stress"
required-features = ["semantic"]

[[example]]
name = "showcase"
required-features = ["semantic"]

[[example]]
name = "unit_cell"
required-features = ["semantic"]
