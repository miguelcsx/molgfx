[package]
name = "molgfx-api"
description = "The declarative MolGFX authoring and rendering contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
molgfx-core.workspace = true
molgfx-gpu.workspace = true
molgfx-math.workspace = true
molgfx-render.workspace = true
molgfx-wgpu.workspace = true
molframe = { workspace = true, features = ["query"] }
num-traits.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zip.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-sys.workspace = true

# The assembly backend is GNU-syntax only, so MSVC cannot build it; every other
# native target keeps the faster digest.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[lints]
workspace = true
