[package]
name = "pdviewx-py"
description = "Thin, typed Python bindings for the pdviewx facade."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "pdviewx_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy.workspace = true
pdbiox-py = { package = "pdbiox-py", path = "../../../pdbiox/crates/pdbiox-py" }
pdviewx = { workspace = true, features = ["semantic"] }
pyo3 = { workspace = true, features = ["multiple-pymethods"] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
too_many_arguments = "allow"
unused_self = "allow"
