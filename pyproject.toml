[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "molgfx"
version = "0.1.1"
requires-python = ">=3.13"
dependencies = ["molframe>=0.1.2"]
# PEP 639. maturin gained full support for the SPDX expression and
# `license-files` in 1.9.0, which the build requirement below already covers.
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
jupyter = ["anywidget>=0.9"]

[tool.maturin]
manifest-path = "crates/molgfx-py/Cargo.toml"
python-source = "python"
module-name = "molgfx._engine"
# The stable ABI, matching molframe's own binding crate. `pyo3/extension-module`
# disables linking libpython for every target, which is what breaks `cargo test`
# in this workspace; maturin sets `PYO3_BUILD_EXTENSION_MODULE` for extension
# builds, so the extension-module behaviour is still in force without the
# feature. Keeping abi3 here is what lets one wheel cover CPython 3.13 and
# later instead of one wheel per minor version.
features = ["pyo3/abi3-py313"]
# The browser runtime is built by wasm-pack into the viewer's static directory
# and is not committed, so it is named here rather than left to discovery:
# without it the Jupyter widget ships a loader with nothing to load.
include = [
    { path = "python/molgfx/viewer/static/molgfx_wasm.js", format = "wheel" },
    { path = "python/molgfx/viewer/static/molgfx_wasm_bg.wasm", format = "wheel" },
]
