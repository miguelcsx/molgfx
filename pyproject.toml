[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "molgfx"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["molframe>=0.1"]
# PEP 639. maturin gained full support for the SPDX expression and
# `license-files` in 1.9.0, which the build requirement below already covers.
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
jupyter = ["anywidget>=0.9"]

[tool.maturin]
manifest-path = "crates/molgfx-py/Cargo.toml"
python-source = "python"
module-name = "molgfx._engine"
features = ["pyo3/extension-module"]
