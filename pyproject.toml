[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "molgfx"
version = "0.1.2"
description = "Semantic, GPU-native molecular rendering, with interactive notebook viewers and a command console"
readme = "README.md"
authors = [{ name = "Miguel Cárdenas", email = "miguelecsx@gmail.com" }]
keywords = ["molecular-visualization", "structural-biology", "webgpu", "jupyter", "rendering", "protein"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
    "Framework :: Jupyter",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = ["molframe>=0.1.2"]
# PEP 639. maturin gained full support for the SPDX expression and
# `license-files` in 1.9.0, which the build requirement below already covers.
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
jupyter = ["anywidget>=0.9"]

[project.urls]
Homepage = "https://github.com/miguelcsx/molgfx"
Repository = "https://github.com/miguelcsx/molgfx"
Issues = "https://github.com/miguelcsx/molgfx/issues"
Documentation = "https://github.com/miguelcsx/molgfx#readme"

[tool.maturin]
manifest-path = "crates/molgfx-py/Cargo.toml"
python-source = "python"
module-name = "molgfx._engine"
# The stable ABI, matching molframe's own binding crate. `pyo3/extension-module`
# disables linking libpython for every target, which is what breaks `cargo test`
# in this workspace; maturin sets `PYO3_BUILD_EXTENSION_MODULE` for extension
# builds, so the extension-module behaviour is still in force without the
# feature. Keeping abi3 here is what lets one wheel cover CPython 3.12 and
# later instead of one wheel per minor version; the floor is 3.12 because that
# is what Google Colab runs.
features = ["pyo3/abi3-py312"]
# The browser runtime is built by wasm-pack into the viewer's static directory
# and is not committed, so it is named here rather than left to discovery:
# without it the Jupyter widget ships a loader with nothing to load.
include = [
    { path = "python/molgfx/viewer/static/molgfx_wasm.js", format = "wheel" },
    { path = "python/molgfx/viewer/static/molgfx_wasm_bg.wasm", format = "wheel" },
]
