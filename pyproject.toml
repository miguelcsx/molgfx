[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "molgfx"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=2", "pdbiox>=0.1"]

[tool.maturin]
manifest-path = "crates/molgfx-py/Cargo.toml"
python-source = "python"
module-name = "molgfx._engine"
features = ["pyo3/extension-module"]
