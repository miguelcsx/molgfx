[workspace]
members = ["crates/*"]
# The engine-only inner loop. Python, WASM and benchmark leaves remain outside
# the default set because their target/tooling dependencies are not required
# while iterating on the renderer.
default-members = [
    "crates/molgfx",
    "crates/molgfx-math",
    "crates/molgfx-core",
    "crates/molgfx-gpu",
    "crates/molgfx-wgpu",
    "crates/molgfx-shaders",
    "crates/molgfx-geometry",
    "crates/molgfx-render",
    "crates/molgfx-semantic",
    "crates/molgfx-api",
]
resolver = "3"

[workspace.metadata.molgfx.wasm]
portable-crates = [
    "molgfx-math",
    "molgfx-core",
    "molgfx-gpu",
    "molgfx-wgpu",
    "molgfx-shaders",
    "molgfx-geometry",
    "molgfx-render",
    "molgfx-semantic",
    "molgfx",
    "molgfx-wasm",
]
portable-test-crates = [
    "molgfx-gpu",
    "molgfx-wgpu",
    "molgfx-shaders",
    "molgfx-wasm",
]
native-only-crates = ["molgfx-bench", "molgfx-py"]
native-only-targets = [
    "criterion benches",
    "blocking-device integration tests",
    "parser/provider fixture tests",
    "proptest suites",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/miguelcsx/molgfx"

[workspace.dependencies]
# Internal crates (layered; a crate depends only on lower layers).
molgfx = { version = "0.1.0", path = "crates/molgfx" }
molgfx-math = { version = "0.1.0", path = "crates/molgfx-math" }
molgfx-core = { version = "0.1.0", path = "crates/molgfx-core" }
molgfx-gpu = { version = "0.1.0", path = "crates/molgfx-gpu" }
molgfx-wgpu = { version = "0.1.0", path = "crates/molgfx-wgpu" }
molgfx-shaders = { version = "0.1.0", path = "crates/molgfx-shaders" }
molgfx-geometry = { version = "0.1.0", path = "crates/molgfx-geometry" }
molgfx-render = { version = "0.1.0", path = "crates/molgfx-render" }
molgfx-semantic = { version = "0.1.0", path = "crates/molgfx-semantic" }
molgfx-api = { version = "0.1.0", path = "crates/molgfx-api" }

# The structural model and every detection the engine consumes.
# Pinned to the published revision carrying the `molframe-*` package names.
molframe = { git = "https://github.com/miguelcsx/molframe", rev = "15a463b28304a5948a4948b2682e41e44693dfaf", default-features = false, features = ["mmcif", "bcif", "pdb"] }
# The provider's Python bridge names its library target `_native`, so the
# dependency is renamed back to the package name for `molframe_py::` to resolve.
molframe-py = { package = "molframe-py", git = "https://github.com/miguelcsx/molframe", rev = "15a463b28304a5948a4948b2682e41e44693dfaf", default-features = false }

# Python ABI shared by the thin binding crate and the sibling molframe bridge.
pyo3 = "0.29"
numpy = "0.29"

# External dependencies, declared once and inherited.
glam = { version = "0.33", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.25", features = ["derive"] }
smallvec = "1.15"
hashbrown = "0.17"
num-traits = "0.2"
rayon = "1.11"
thiserror = "2.0"
roaring = "0.11"
bitflags = "2.13"
# No default features: `wgpu-core` already target-gates its heavy
# per-backend dependency crates internally (Apple/Windows-Linux-Android/wasm
# each pull a different `wgpu-core-deps-*` crate), so this doesn't change
# what actually compiles on a given host — it's explicit platform intent and
# a guard against `wgpu`'s own `default` feature list growing under us.
# `molgfx-wgpu` adds the backend features per target.
wgpu = { version = "30", default-features = false }
naga = { version = "30", features = ["wgsl-in"] }
raw-window-handle = "0.6"
pollster = "0.4"
futures-channel = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
web-time = "1.1"
proptest = "1.11"
criterion = "0.8"
winit = "0.30"
fontdue = "0.9"
png = "0.18"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = { version = "0.10", features = ["asm"] }
zip = { version = "5", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
# A `pub` inside a private module is not reachable from outside the crate, so it
# documents nothing and reads as if it were part of the API. Every crate here
# declares its modules privately and re-exports what it means to publish, so this
# lint only ever fires on a new item that was not meant to be public.
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
# Thin LTO, not none: the math types are thin wrappers over glam that only
# collapse once they inline across the crate boundary. Measuring them without
# any LTO measures a call sequence the release build never emits.
lto = "thin"
