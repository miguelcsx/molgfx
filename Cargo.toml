[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.metadata.pdviewx.wasm]
portable-crates = [
    "pdviewx-math",
    "pdviewx-core",
    "pdviewx-gpu",
    "pdviewx-gpu-wgpu",
    "pdviewx-shaders",
    "pdviewx-geometry",
    "pdviewx-render",
    "pdviewx-semantic",
    "pdviewx",
    "pdviewx-wasm",
]
portable-test-crates = [
    "pdviewx-gpu",
    "pdviewx-gpu-wgpu",
    "pdviewx-shaders",
    "pdviewx-wasm",
]
native-only-crates = ["pdviewx-bench", "pdviewx-py"]
native-only-targets = [
    "pdviewx examples",
    "criterion benches",
    "blocking-device integration tests",
    "parser/provider fixture tests",
    "proptest suites",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/miguelcsx/pdviewx"

[workspace.dependencies]
# Internal crates (layered; a crate depends only on lower layers).
pdviewx = { version = "0.1.0", path = "crates/pdviewx" }
pdviewx-math = { version = "0.1.0", path = "crates/pdviewx-math" }
pdviewx-core = { version = "0.1.0", path = "crates/pdviewx-core" }
pdviewx-gpu = { version = "0.1.0", path = "crates/pdviewx-gpu" }
pdviewx-gpu-wgpu = { version = "0.1.0", path = "crates/pdviewx-gpu-wgpu" }
pdviewx-shaders = { version = "0.1.0", path = "crates/pdviewx-shaders" }
pdviewx-geometry = { version = "0.1.0", path = "crates/pdviewx-geometry" }
pdviewx-render = { version = "0.1.0", path = "crates/pdviewx-render" }
pdviewx-semantic = { version = "0.1.0", path = "crates/pdviewx-semantic" }
pdviewx-recipes = { version = "0.1.0", path = "crates/pdviewx-recipes" }

# The structural model and every detection the engine consumes.
# Pin the coordinated provider revision so builds never depend on a mutable
# sibling checkout.
pdbiox = { git = "ssh://git@github.com/miguelcsx/pdbiox.git", rev = "27900eb8d93bfe8d8fd3eb2d643e00b77c0e28e1", default-features = false, features = ["mmcif", "bcif", "pdb"] }

# Python ABI shared by the thin binding crate and the sibling pdbiox bridge.
pyo3 = "0.29"
numpy = "0.29"

# External dependencies, declared once and inherited.
glam = { version = "0.33", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.25", features = ["derive"] }
smallvec = "1.15"
hashbrown = "0.17"
num-traits = "0.2"
rayon = "1.11"
thiserror = "2.0"
roaring = "0.11"
bitflags = "2.13"
wgpu = "30"
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
raw-window-handle = "0.6"
pollster = "0.4"
futures-channel = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
web-time = "1.1"
proptest = "1.11"
criterion = "0.8"
winit = "0.30"
fontdue = "0.9"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The no-unwrap rule includes unwrap_or and unwrap_or_default; these two lints
# would rewrite the compliant `match`/`let..else` forms back into unwrap_or
# calls, so they stay allowed. Do not "fix" these allows.
manual_unwrap_or = "allow"
manual_unwrap_or_default = "allow"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
# Thin LTO, not none: the math types are thin wrappers over glam that only
# collapse once they inline across the crate boundary. Measuring them without
# any LTO measures a call sequence the release build never emits.
lto = "thin"
